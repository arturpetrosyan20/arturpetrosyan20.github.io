    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #06140d;
            --card-bg: #0b2016;
            --accent-color: #00ff88;
            --accent-soft: rgba(0, 255, 136, 0.12);
            --border-color: rgba(0, 255, 136, 0.22);
            --glow: rgba(0, 255, 136, 0.14);
            --text-main: #e6f7ee;
            --text-dim: #8fb5a1;
            --header-bg: linear-gradient(90deg, rgba(4, 38, 22, 0.96), rgba(7, 68, 40, 0.94));
        }

        .light-theme {
            --bg-color: #ecfdf5;
            --card-bg: #ffffff;
            --accent-color: #10b981;
            --accent-soft: rgba(16, 185, 129, 0.14);
            --border-color: rgba(16, 185, 129, 0.38);
            --glow: rgba(16, 185, 129, 0.22);
            --text-main: #12301f;
            --text-dim: #4b6b5c;
            --header-bg: linear-gradient(90deg, #d1fae5, #a7f3d0);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at top, var(--glow), transparent 60%) fixed, var(--bg-color);
            min-height: 100vh;
            color: var(--text-main);
            transition: 0.3s;
        }
        ::selection { background: var(--accent-color); color: #000; }

        header {
            position: fixed;
            top: 0; width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 4px 24px var(--glow);
        }
        header h1 { text-shadow: 0 0 14px var(--glow); letter-spacing: 0.5px; }

        .search-section { margin-top: 100px; text-align: center; padding: 20px; }
        .search-bar input {
            width: 100%; max-width: 500px;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: 0.25s;
        }
        .search-bar input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px var(--accent-soft); }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--card-bg);
            color: var(--text-dim);
            border: 1px solid var(--border-color);
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .tab-btn:hover { color: var(--text-main); border-color: var(--accent-color); }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 16px var(--glow);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 10px 30px var(--glow); }
        .card h3 { margin: 0 0 10px; font-size: 1.1rem; }
        .card p { color: var(--text-dim); font-size: 0.85rem; flex-grow: 1; margin-bottom: 20px; word-break: break-word; }

        .download-btn {
            background: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .command-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }
        .command-btn:hover { background: var(--accent-soft); }
        .download-btn:hover { filter: brightness(1.1); box-shadow: 0 0 14px var(--glow); }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 60px 20px;
            font-size: 0.95rem;
        }

        .theme-btn { background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 1.2rem; }
        footer { text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid var(--border-color); margin-top: 20px; }
    
        .lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .lock form {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 28px; width: 100%; max-width: 360px;
            display: flex; flex-direction: column; gap: 12px; text-align: center;
        }
        .lock h2 { margin: 0 0 4px; font-size: 1.1rem; }
        .lock input {
            padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: var(--bg-color); color: var(--text-main); font-size: 1rem; outline: none;
        }
        .lock input:focus { border-color: var(--accent-color); }
        .lock .msg { margin: 0; min-height: 1.2em; font-size: 0.85rem; color: #f87171; }
        .lock .show { display: flex; gap: 6px; align-items: center; justify-content: center;
                      font-size: 0.85rem; color: var(--text-dim); cursor: pointer; }
        .lock .show input { width: auto; padding: 0; }
        .lock .build { margin: 0; font-size: 0.7rem; color: var(--text-dim); opacity: 0.6; }
        [hidden] { display: none !important; }
    </style>
</head>

<script>
    const themeIcon = document.querySelector('.theme-btn i');

    function applyTheme(isLight) {
        document.body.classList.toggle('light-theme', isLight);
    }

    function toggleTheme() {
        const isLight = !document.body.classList.contains('light-theme');
        applyTheme(isLight);
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    applyTheme(localStorage.getItem('theme') === 'light');

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        document.querySelectorAll('.tab-panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === 'panel-' + tab);
        });
        document.getElementById('search').value = '';
        filterPrograms();
    }

    function filterPrograms() {
        const query = document.getElementById('search').value.toLowerCase();
        const activePanel = document.querySelector('.tab-panel.active');
        activePanel.querySelectorAll('.card').forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            card.style.display = name.includes(query) ? 'flex' : 'none';
        });
    }

    function copyText(text) {
        // Пробуем современный способ (работает только на https/localhost)
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        // Запасной способ для http и локальных файлов
        return new Promise((resolve, reject) => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                success ? resolve() : reject(new Error('execCommand failed'));
            } catch (err) {
                document.body.removeChild(textarea);
                reject(err);
            }
        });
    }

    function bindCommandButtons() {
    document.querySelectorAll('.command-btn').forEach(btn => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', () => {
            const command = btn.previousElementSibling.textContent.trim();
            const original = btn.textContent;
            copyText(command).then(() => {
                btn.textContent = 'Скопировано!';
                setTimeout(() => { btn.textContent = original; }, 1500);
            }).catch(() => {
                btn.textContent = 'Не удалось скопировать';
                setTimeout(() => { btn.textContent = original; }, 2000);
            });
        });
    });
    }
    bindCommandButtons();
</script>

    // ---- счётчик ошибок и блокировка (хранится в браузере) ----
    function getNum(key) {
        try { return parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (e) { return 0; }
    }
    function setNum(key, val) {
        try { localStorage.setItem(key, String(val)); } catch (e) {}
    }
    function clearKey(key) {
        try { localStorage.removeItem(key); } catch (e) {}
    }

    function closeSite() {
        document.body.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +

            '<p style="margin:0;color:#94a3b8">Слишком много неверных попыток.</p></div></div>';
        try { window.close(); } catch (e) {}
        setTimeout(function () { location.replace('about:blank'); }, 1500);
    }

    // сайт уже закрыт после прошлых ошибок?
    if (getNum('lockUntil') > Date.now()) { closeSite(); return; }
    if (getNum('lockUntil')) { clearKey('lockUntil'); clearKey('attempts'); }

    // пароль не запоминается: старое сохранённое значение стираем
    try { sessionStorage.removeItem('vk'); } catch (e) {}

    function fromB64(s) {
        const bin = atob(s);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }

    async function decrypt(password) {
        const raw = fromB64(VAULT);
        const salt = raw.slice(0, 16);
        const iv = raw.slice(16, 28);
        const data = raw.slice(28);
        const material = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
            material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
        return new TextDecoder().decode(plain);
    }

    // совпадает ли зашифрованный блок с тем, что был при сборке (не повреждён ли файл)
    async function integrityOk() {
        try {
            const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(VAULT));
            const hex = Array.from(new Uint8Array(d)).map(function (b) {
                return b.toString(16).padStart(2, '0');
            }).join('');
            return hex === VAULT_SHA;
        } catch (e) {
            return true;
        }
    }

    function show(html) {
        vault.innerHTML = html;
        lock.hidden = true;
        search.hidden = false;
        if (typeof bindCommandButtons === 'function') bindCommandButtons();
    }

    form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        msg.textContent = '';
        if (!window.crypto || !crypto.subtle) {
            msg.textContent = 'Нужен https:// или localhost (браузер блокирует шифрование на http).';
            return;
        }
        const btn = form.querySelector('button');
        btn.disabled = true;
        // пробуем пароль как есть, без пробелов по краям (мобильные клавиатуры
        // любят добавлять пробел после слова) и в нормализованном виде
        const typed = input.value;
        const candidates = [typed];
        const trimmed = typed.trim();
        if (trimmed !== typed) candidates.push(trimmed);
        const norm = trimmed.normalize('NFC');
        if (candidates.indexOf(norm) === -1) candidates.push(norm);

        let html = null;
        let failure = null;
        for (let i = 0; i < candidates.length; i++) {
            try {
                html = await decrypt(candidates[i]);
                break;
            } catch (e) {
                // OperationError = пароль не подошёл; всё остальное - проблема браузера
                if (e && e.name !== 'OperationError') { failure = e; break; }
            }
        }
        btn.disabled = false;

        if (failure) {
            msg.textContent = 'Ошибка браузера (' + failure.name + '): ' + failure.message;
            return;  // это не неверный пароль, попытка не засчитывается
        }
        if (html === null && !(await integrityOk())) {
            input.value = '';
            msg.textContent = 'Файл index.html повреждён или загружен не полностью. ' +
                'Загрузите на сайт заново целиком. Попытка не засчитана.';
            return;
        }
        input.value = '';

        if (html !== null) {
            clearKey('attempts');
            clearKey('lockUntil');
            show(html);
            return;
        }

        const attempts = getNum('attempts') + 1;
        setNum('attempts', attempts);
        if (attempts >= MAX_ATTEMPTS) {
            setNum('lockUntil', Date.now() + LOCK_MINUTES * 60 * 1000);
            closeSite();
        } else {
            msg.textContent = 'Неверный пароль. Осталось попыток: ' + (MAX_ATTEMPTS - attempts);
            input.focus();
        }
    });
})();
</script>
