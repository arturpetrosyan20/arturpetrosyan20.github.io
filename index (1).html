<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>ArtMobile | Downloads</title>
    <meta name="description" content="ArtMobile — ծրագրերի և դրայվերների ներբեռնում։ Photoshop, Office, WinRAR և այլն։">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1113;
            --card-bg: #1a1d21;
            --accent-color: #00ff88;
            --text-main: #e0e6ed;
            --text-dim: #94a3b8;
            --header-bg: rgba(26, 29, 33, 0.9);
        }

        .light-theme {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent-color: #10b981;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --header-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            transition: 0.3s;
        }

        header {
            position: fixed;
            top: 0; width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .search-section { margin-top: 100px; text-align: center; padding: 20px; }
        .search-bar input {
            width: 100%; max-width: 500px;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--card-bg);
            color: var(--text-dim);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .tab-btn:hover { color: var(--text-main); border-color: var(--accent-color); }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .card h3 { margin: 0 0 10px; font-size: 1.1rem; }
        .card p { color: var(--text-dim); font-size: 0.85rem; flex-grow: 1; margin-bottom: 20px; word-break: break-word; }

        .download-btn {
            background: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .command-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }
        .command-btn:hover { background: rgba(0,255,136,0.1); }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 60px 20px;
            font-size: 0.95rem;
        }

        .theme-btn { background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 1.2rem; }
        footer { text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.8rem; }
    
        .lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .lock form {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 28px; width: 100%; max-width: 360px;
            display: flex; flex-direction: column; gap: 12px; text-align: center;
        }
        .lock h2 { margin: 0 0 4px; font-size: 1.1rem; }
        .lock input {
            padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: var(--bg-color); color: var(--text-main); font-size: 1rem; outline: none;
        }
        .lock input:focus { border-color: var(--accent-color); }
        .lock .msg { margin: 0; min-height: 1.2em; font-size: 0.85rem; color: #f87171; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 1.4rem; color: var(--accent-color)">ArtMobile</h1>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Переключить тему"><i class="fas fa-adjust"></i></button>
</header>

<div class="search-section" hidden>
    <div class="search-bar">
        <input type="text" id="search" placeholder="Поиск программ..." aria-label="Поиск программ" onkeyup="filterPrograms()">
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="pc" onclick="switchTab('pc')">Համակարգիչ</button>
        <button class="tab-btn" data-tab="android" onclick="switchTab('android')">Հեռախոսների Ծրագիրներ</button>
        <button class="tab-btn" data-tab="dev" onclick="switchTab('dev')">Ծրագրավորում</button>
    </div>
</div>


<div id="lock" class="lock">
    <form id="lock-form" autocomplete="off">
        <h2><i class="fas fa-lock"></i> Закрытый раздел</h2>
        <input type="password" id="pw" placeholder="Пароль" aria-label="Пароль" autofocus required>
        <button type="submit" class="download-btn">Войти</button>
        <p class="msg" id="lock-msg" role="alert"></p>
    </form>
</div>
<div id="vault"></div>
<footer>
    © 2026 ArtMobile. Все права защищены.
</footer>

<script>
    const themeIcon = document.querySelector('.theme-btn i');

    function applyTheme(isLight) {
        document.body.classList.toggle('light-theme', isLight);
    }

    function toggleTheme() {
        const isLight = !document.body.classList.contains('light-theme');
        applyTheme(isLight);
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    applyTheme(localStorage.getItem('theme') === 'light');

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        document.querySelectorAll('.tab-panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === 'panel-' + tab);
        });
        document.getElementById('search').value = '';
        filterPrograms();
    }

    function filterPrograms() {
        const query = document.getElementById('search').value.toLowerCase();
        const activePanel = document.querySelector('.tab-panel.active');
        activePanel.querySelectorAll('.card').forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            card.style.display = name.includes(query) ? 'flex' : 'none';
        });
    }

    function copyText(text) {
        // Пробуем современный способ (работает только на https/localhost)
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        // Запасной способ для http и локальных файлов
        return new Promise((resolve, reject) => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                success ? resolve() : reject(new Error('execCommand failed'));
            } catch (err) {
                document.body.removeChild(textarea);
                reject(err);
            }
        });
    }

    function bindCommandButtons() {
    document.querySelectorAll('.command-btn').forEach(btn => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', () => {
            const command = btn.previousElementSibling.textContent.trim();
            const original = btn.textContent;
            copyText(command).then(() => {
                btn.textContent = 'Скопировано!';
                setTimeout(() => { btn.textContent = original; }, 1500);
            }).catch(() => {
                btn.textContent = 'Не удалось скопировать';
                setTimeout(() => { btn.textContent = original; }, 2000);
            });
        });
    });
    }
    bindCommandButtons();
</script>

    const ITER = 250000;
    const MAX_ATTEMPTS = 3;   // сколько ошибок до закрытия сайта
    const LOCK_MINUTES = 30;    // на сколько минут сайт закрывается

    const lock = document.getElementById('lock');
    const form = document.getElementById('lock-form');
    const input = document.getElementById('pw');
    const msg = document.getElementById('lock-msg');
    const vault = document.getElementById('vault');
    const search = document.querySelector('.search-section');

    // ---- счётчик ошибок и блокировка (хранится в браузере) ----
    function getNum(key) {
        try { return parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (e) { return 0; }
    }
    function setNum(key, val) {
        try { localStorage.setItem(key, String(val)); } catch (e) {}
    }
    function clearKey(key) {
        try { localStorage.removeItem(key); } catch (e) {}
    }

    function closeSite() {
        document.body.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'font-family:sans-serif;text-align:center;padding:20px;background:#0f1113;color:#e0e6ed">' +
            '<div><h2 style="margin:0 0 8px">Доступ закрыт</h2>' +
            '<p style="margin:0;color:#94a3b8">Слишком много неверных попыток.</p></div></div>';
        try { window.close(); } catch (e) {}
        setTimeout(function () { location.replace('about:blank'); }, 1500);
    }

    // сайт уже закрыт после прошлых ошибок?
    if (getNum('lockUntil') > Date.now()) { closeSite(); return; }
    if (getNum('lockUntil')) { clearKey('lockUntil'); clearKey('attempts'); }

    // пароль не запоминается: старое сохранённое значение стираем
    try { sessionStorage.removeItem('vk'); } catch (e) {}

    function fromB64(s) {
        const bin = atob(s);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }

    async function decrypt(password) {
        const raw = fromB64(VAULT);
        const salt = raw.slice(0, 16);
        const iv = raw.slice(16, 28);
        const data = raw.slice(28);
        const material = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
            material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
        return new TextDecoder().decode(plain);
    }

    function show(html) {
        vault.innerHTML = html;
        lock.hidden = true;
        search.hidden = false;
        if (typeof bindCommandButtons === 'function') bindCommandButtons();
    }

    form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        msg.textContent = '';
        if (!window.crypto || !crypto.subtle) {
            msg.textContent = 'Нужен https:// или localhost (браузер блокирует шифрование на http).';
            return;
        }
        const btn = form.querySelector('button');
        btn.disabled = true;
        let html = null;
        try {
            html = await decrypt(input.value);
        } catch (e) {
            html = null;
        }
        btn.disabled = false;
        input.value = '';

        if (html !== null) {
            clearKey('attempts');
            clearKey('lockUntil');
            show(html);
            return;
        }

        const attempts = getNum('attempts') + 1;
        setNum('attempts', attempts);
        if (attempts >= MAX_ATTEMPTS) {
            setNum('lockUntil', Date.now() + LOCK_MINUTES * 60 * 1000);
            closeSite();
        } else {
            msg.textContent = 'Неверный пароль. Осталось попыток: ' + (MAX_ATTEMPTS - attempts);
            input.focus();
        }
    });
})();
